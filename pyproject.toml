[project]
name = "decision-coder"
version = "0.7.0"
description = "面向经营决策与运筹优化场景的垂直 Coding Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "luoshouer", email = "robertluo03@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-deepseek>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "requests>=2.0",
    "flask>=3.0",
    "plotly>=5.0",
    "duckdb>=0.10",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
[project.scripts]
decision-coder-mcp = "src.mcp.server:start_server"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
